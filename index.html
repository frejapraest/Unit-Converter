<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="top-body">
            <h1>Metric/Imperial Unit Conversion</h1>
            <input id="input-el"></input>
            <p id="error-message"></p>
            <button id="btn-el">Convert</button>
        </div>
        <div id="container">
            <div id="length-el">
                <h3 id="unit-name-el">Length (Meter/Feet)</h3>
                <p id="length-unit-el">1 meter = 3.281 feet | 1 foot =  0.305 meters</p>
            </div>
            <div id="volume-el">
                <h3 id="unit-name-el">Volume (Liters/Gallons)</h3>
                <p id="volume-unit-el">1 liter = 0.264 gallon | 1 gallon = 3.788 liters</p>
            </div>
            <div id="mass-el">
                <h3 id="unit-name-el">Mass (Kilograms/Pounds)</h3>
                <p id="mass-unit-el">1 kilogram = 2.204 pounds | 1 pound = 0.454 kilograms</p>
            </div>
        </div>
        <script src="index.js"></script>
    </body>
</html>
